<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility Nav</title>
    <link rel="stylesheet" href="./../public/css/style.css">
    <link rel="stylesheet" href="./../public/css/density.css">
    <link rel="stylesheet" href="./../public/css/introjs.css">
    <link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
    <script src="./../public/javascript/d3.v7.js"></script>
    <script src="https://kit.fontawesome.com/10539d7a54.js" crossorigin="anonymous"></script>
    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>
</head>
<body>
    <main>
        <div id="container" data-step="1" data-title="Welcome!" data-intro="Here is Information Visualisation project by Team 28! Delve into our work on mapping public transport networks and their influence on urban landscapes. This map is our main visual, all the information will be placed here.">
            <div id="sidebar" class="sidebar" data-step="2" data-intro="Here is our navigation list. You can click here to open or close the full menu.">
<!--                 <h2>Mode</h2> -->
                <div class="logo-details">
                    <i class='bx bxl-c-plus-plus icon'></i>
                    <div class="logo_name">Menu</div>
                    <i class='bx bx-menu' id="btn"></i>
                </div>
                <ul class="nav-list">
                    <li data-step="3" data-intro="Click here to return homepage.">
                        <a href="./../public/index.html">
                            <i class="fa-solid fa-home"></i>
                            <span class="links_name">Home</span>
                        </a>
                        <span class="tooltip">Home</span>
                    </li>
                    <li>
                        <a href="javascript:introJs().setOption('showProgress', true).start();">
                            <i class='bx bx-grid-alt'></i>
                            <span class="links_name">Tutorial</span>
                        </a>
                        <span class="tooltip">Tutorial</span>
                    </li>
                    <li data-step="4" data-intro="Here is where you're right now!">
                        <a href="./../public/density.html">
                            <i class="fa fa-fw fa-magnet"></i>
                            <span class="links_name">Mobility</span>
                        </a>
                        <span class="tooltip">Mobility</span>
                    </li>
                    <li data-step="5" data-intro="Click here to see how population distribution in Muncih changed from 2012 to 2022">
                        <a href="./../public/cluster.html">
                            <i class="fa fa-fw fa-user-circle"></i>
                            <span class="links_name">Timeline</span>
                        </a>
                        <span class="tooltip">Timeline</span>
                    </li>
                    <li data-step="6" data-intro="You can see more information about our team on this page.">
                        <a href="./../public/about.html">
                            <i class='bx bx-heart'></i>
                            <span class="links_name">About Us</span>
                        </a>
                        <span class="tooltip">About Us</span>
                    </li>
                </ul>
            </div>
            <div id="wrapper" class="flex-center">
                <svg class="VisSVG flex-center"></svg>
            </div>
            <div class="flex-column flex-center" id="accordion" data-step="7" data-intro="Here are our filters list where you can control all the information display">

                <!--<h2>Filters</h2>-->   
                <button class="accordion-btn">Administrative Border</button>
                <div class="panel">
                    <input type="checkbox" id="AB-1" checked>
                    <label for="AB-1">City Districts</label>
                    <input type="checkbox" id="AB-2">
                    <label for="AB-2">Subdistricts</label>  
                    <input type="checkbox" id="AB-3">
                    <label for="AB-3">Quarters</label>
                </div>
    
                <button class="accordion-btn" data-step="8" data-intro="Klick the accordion button to see all the filters.">Public Facility</button>
                <div class="panel" data-step="9" data-intro="Here you can click the checkbox to see the information you want to see.">
                    <input type="checkbox" id="AB-5">
                    <label for="AB-5">WC</label>
                    <input type="checkbox" id="AB-6">
                    <label for="AB-6">Market</label>
                    <input type="checkbox" id="AB-7">
                    <label for="AB-7">Mobile Point</label>
                </div>
    
                <button class="accordion-btn">Transportations</button>
                <div class="panel">
                    <input type="checkbox" id="AB-4">
                    <label for="AB-4">Stations</label>
                    <input type="checkbox" id="AB-8">
                    <label for="AB-8">Main Stations</label>
                </div>

                <div id="info-checkbox" for="infoToggle" data-step="10" data-intro="Turning on this slider button, you can now see the area information by hovering you mouse on the map.">
                    <label class="flex-row" id="info-checkbox-label" for="infoToggle">
                        <label class="switch-label">Area Info</label>
                        <div class="switch">
                            <input type="checkbox" id="infoToggle">
                            <span class="slider round"></span>
                        </div>
                    </label>                    
                </div>

                <div id="info-checkbox" for="StopinfoToggle" data-step="11" data-intro="Turning on this slider button, you can now see all the mobility information by hovering you mouse on the point icons.">
                    <label class="flex-row" id="info-checkbox-label" for="StopinfoToggle">
                        <label class="switch-label">Mobility Info</label>
                        <div class="switch">
                            <input type="checkbox" id="StopinfoToggle">
                            <span class="slider round"></span>
                        </div>
                    </label>                    
                </div>
                
            </div>
            <div id="tooltip"></div>
        </div>
    </main>

    <footer>
        <p>&copy; Group 28 InfoVis</p>
    </footer>
    <script src="./../public/javascript/data.js"></script>
    <script src="./../public/javascript/draw-map.js"></script>
    <script type="text/javascript" src="./../public/javascript/intro.js"></script>
</body>
</html>
